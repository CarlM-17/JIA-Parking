<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIA Parking - Cashier</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; padding: 12px; min-height: 100vh; }
  h1 { color: #60a5fa; margin-bottom: 12px; text-align: center; }
  nav { text-align: center; margin-bottom: 12px; }
  nav a, nav button { display: inline-block; padding: 6px 12px; background: #1e40af; color: white; text-decoration: none; border-radius: 6px; margin: 0 4px; font-size: 14px; border: none; cursor: pointer; }
  nav .logout { background: #dc2626; }
  #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #1e293b; }
  .card { background: #1e293b; padding: 16px; border-radius: 12px; margin: 12px auto; max-width: 500px; }
  .result-ok { background: #065f46; border: 2px solid #10b981; }
  .result-entry { background: #1e3a8a; border: 2px solid #3b82f6; }
  .result-err { background: #7f1d1d; border: 2px solid #ef4444; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .row:last-child { border: none; }
  .lbl { color: #94a3b8; }
  .val { font-weight: 600; }
  .big { font-size: 32px; text-align: center; padding: 12px; color: #fbbf24; font-weight: bold; }
  .charge { font-size: 48px; text-align: center; padding: 16px; color: #fbbf24; font-weight: bold; }
  button { width: 100%; padding: 14px; font-size: 18px; border-radius: 8px; border: none; background: #1e40af; color: white; cursor: pointer; margin-top: 8px; }
  button:hover { background: #1e3a8a; }
  .manual { margin: 12px auto; max-width: 500px; }
  .manual input { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
</style>
</head>
<body>
<h1>JIA Cashier - Scan QR</h1>
<div style="text-align:center;color:#94a3b8;margin-bottom:8px;font-size:14px">Logged in as: <span id="whoami"></span></div>
<nav>
  <a href="/cashier">Scan</a>
  <button class="logout" onclick="logout()">Logout</button>
</nav>
<script>document.getElementById('whoami').textContent = USERID + ' - ' + NAME;</script>

<div id="reader"></div>

<div class="manual">
  <input id="manualInput" placeholder="Or type QR code manually (e.g. JIA-0001)">
  <button onclick="manualSubmit()">Submit</button>
</div>

<div id="resultBox"></div>

<script>
const TOKEN = localStorage.getItem('jia_token');
const ROLE = localStorage.getItem('jia_role');
const USERID = localStorage.getItem('jia_userid') || 'admin';
const NAME = localStorage.getItem('jia_name') || '';
if (!TOKEN || (ROLE !== 'admin' && ROLE !== 'cashier')) window.location.href = '/login.html';

function logout() {
  localStorage.clear();
  window.location.href = '/login.html';
}

let scanner = null;
let processing = false;
let lastScanTime = 0;

function beep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'ok') {
      osc.frequency.value = 880; // high pitch success
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } else if (type === 'exit') {
      // Two beeps for exit
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
      osc.stop(ctx.currentTime + 0.35);
    } else {
      // Error - low buzz
      osc.frequency.value = 200;
      osc.type = 'sawtooth';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) { console.log('Audio unavailable'); }
}

function startScanner() {
  scanner = new Html5Qrcode('reader');
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  scanner.start({ facingMode: 'environment' }, config, onScanSuccess).catch(err => {
    document.getElementById('reader').innerHTML =
      '<div style="padding:20px;text-align:center;color:#fbbf24">Camera not available. Use manual entry below.<br><small>' + err + '</small></div>';
  });
}

function onScanSuccess(decodedText) {
  const now = Date.now();
  if (processing || (now - lastScanTime < 3000)) return;
  lastScanTime = now;
  processScan(decodedText.trim());
}

async function manualSubmit() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  document.getElementById('manualInput').value = '';
  await processScan(val);
}

async function processScan(qr_id) {
  processing = true;
  showLoading(qr_id);
  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'x-auth-token': TOKEN, 'x-user-id': USERID},
      body: JSON.stringify({ qr_id })
    });
    if (res.status === 401) return logout();
    const data = await res.json();
    if (data.ok) {
      beep(data.mode === 'EXIT' ? 'exit' : 'ok');
      showResult(data);
    } else {
      beep('err');
      showError(data.error || 'Unknown error', qr_id);
    }
  } catch (e) {
    beep('err');
    showError('Network error: ' + e.message, qr_id);
  }
  setTimeout(() => { processing = false; }, 2000);
}

function showLoading(id) {
  document.getElementById('resultBox').innerHTML =
    '<div class="card"><div style="text-align:center">Checking ' + id + '...</div></div>';
}

function showResult(d) {
  const cssClass = d.mode === 'EXIT' ? 'result-ok' : 'result-entry';
  let html = '<div class="card ' + cssClass + '">';
  html += '<div class="big">' + d.mode + '</div>';
  html += '<div class="row"><span class="lbl">Ticket</span><span class="val">' + d.ticket_no + '</span></div>';
  html += '<div class="row"><span class="lbl">QR ID</span><span class="val">' + d.qr_id + '</span></div>';
  if (d.plate) html += '<div class="row"><span class="lbl">Plate</span><span class="val">' + d.plate + '</span></div>';
  if (d.owner) html += '<div class="row"><span class="lbl">Note</span><span class="val">' + d.owner + '</span></div>';
  html += '<div class="row"><span class="lbl">Time In</span><span class="val">' + d.time_in + '</span></div>';
  if (d.mode === 'EXIT') {
    html += '<div class="row"><span class="lbl">Time Out</span><span class="val">' + d.time_out + '</span></div>';
    html += '<div class="row"><span class="lbl">Duration</span><span class="val">' + d.duration_hrs + ' hrs</span></div>';
    html += '<div class="row"><span class="lbl">Cashier (In)</span><span class="val">' + (d.cashier_in||'-') + '</span></div>';
    html += '<div class="row"><span class="lbl">Cashier (Out)</span><span class="val">' + (d.cashier_out||'-') + '</span></div>';
    html += '<div class="charge">PHP ' + d.charge + '</div>';
    html += '<div style="text-align:center;color:#fca5a5;padding:8px">QR is now deactivated (one-time use)</div>';
  } else {
    html += '<div class="row"><span class="lbl">Cashier</span><span class="val">' + (d.cashier||'-') + '</span></div>';
    html += '<div style="text-align:center;padding:12px;color:#93c5fd">Ticket issued. Scan again upon exit.</div>';
  }
  html += '<button onclick="clearResult()">Next Scan</button>';
  html += '</div>';
  document.getElementById('resultBox').innerHTML = html;
}

function showError(msg, qr_id) {
  document.getElementById('resultBox').innerHTML =
    '<div class="card result-err"><div class="big">INVALID</div>' +
    '<div class="row"><span class="lbl">Code</span><span class="val">' + (qr_id||'') + '</span></div>' +
    '<div class="row"><span class="lbl">Reason</span><span class="val">' + msg + '</span></div>' +
    '<button onclick="clearResult()">Try Again</button></div>';
}

function clearResult() {
  document.getElementById('resultBox').innerHTML = '';
}

startScanner();
</script>
</body>
</html>
